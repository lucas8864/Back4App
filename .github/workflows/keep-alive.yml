name: Back4App Keep Alive

on:
  schedule:
    - cron: "3,13,23,33,43,53 * * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  keep-alive:
    runs-on: ubuntu-latest
    timeout-minutes: 2

    steps:
      - name: Ping node-ws-lite
        run: |
          echo "Pinging node-ws-lite..."
          curl -L \
            --connect-timeout 10 \
            --max-time 30 \
            -sS \
            -o /dev/null \
            -w "node-ws-lite: HTTP %{http_code}\n" \
            "https://nodewslite-w67v5892.b4a.run/"

      - name: Ping lalucas
        run: |
          echo "Pinging lalucas..."
          curl -L \
            --connect-timeout 10 \
            --max-time 30 \
            -sS \
            -o /dev/null \
            -w "lalucas: HTTP %{http_code}\n" \
            "https://lalucas-ch5011h3.b4a.run/"
